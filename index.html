<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Overlay Scheduler</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: var(--text-main);
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-text {
            flex: 1;
            min-width: 280px;
        }

        .header-text h1 {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 600;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: left;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
            }

            .header-text h1,
            .header-text p {
                text-align: left;
            }
        }

        .header-text p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 4px;
            text-align: left;
        }

        .btn-add {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: none;
            border: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 2px;
            width: 100%;
        }

        .card-title:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-remove:hover {
            background: var(--error);
            color: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .input-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            font-size: 13px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
        }

        /* Hide Number Spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
            text-align: center;
        }

        .stepper {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stepper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
        }

        .stepper input {
            border: none;
            background: transparent;
            width: 100%;
            border-radius: 0;
            padding: 12px 0;
        }

        .stepper input:focus {
            box-shadow: none;
        }

        .btn-step {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }

        .btn-step:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-step:active {
            background: var(--primary);
            color: white;
        }

        .durations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .timer-val {
            font-size: 24px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .status-label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-manual {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-manual:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-manual.btn-on:active {
            background: var(--success);
            color: white;
        }

        .btn-manual.btn-off:active {
            background: var(--error);
            color: white;
        }

        .btn-main.running {
            background: var(--error);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .logs {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            height: 80px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-dim);
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.success {
            color: var(--success);
        }

        .log-entry.error {
            color: var(--error);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            color: var(--text-dim);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-text">
            <h1>Dynamic Overlay Scheduler</h1>
            <p>Dashboard kontrol overlay mandiri dan fleksibel</p>
        </div>
        <div class="header-btns" style="display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="https://overlays.uno/myoverlays/all" target="_blank" class="btn-add"
                style="background: rgba(255,255,255,0.1); box-shadow: none; text-decoration: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                My Overlays
            </a>
            <button class="btn-add" id="btnAddOverlay">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Tambah Overlay
            </button>
        </div>
    </div>

    <div class="grid" id="schedulerGrid">
        <!-- Cards will be injected here -->
    </div>

    <script>
        class OverlayScheduler {
            constructor(data) {
                this.id = data.id || Date.now().toString();
                this.label = data.label || 'New Overlay';
                this.token = data.token || '';
                this.onMin = data.onMin || 0;
                this.offMin = data.offMin || 0;

                this.isRunning = false;
                this.timerInterval = null;
                this.currentState = 'OFF';
                this.remainingTime = 0;

                this.render();
            }

            render() {
                const grid = document.getElementById('schedulerGrid');
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${this.id}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="status-dot" id="dot-${this.id}"></div>
                            <input class="card-title" id="label-${this.id}" value="${this.label}" placeholder="Nama Overlay..">
                        </div>
                        <button class="btn-remove" id="remove-${this.id}" title="Hapus">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                    
                    <div class="input-group">
                        <label>API Key / Token</label>
                        <div style="display: flex; gap: 6px;">
                            <input type="text" id="token-${this.id}" value="${this.token}" placeholder="Token.." style="flex: 1;">
                            <button class="btn-step" id="open-${this.id}" title="Buka Kontrol Asli" style="height: 38px; width: 38px; border-radius: 10px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </button>
                        </div>
                    </div>

                    <div class="durations" style="gap: 12px;">
                        <div class="input-group">
                            <label>ON (Menit)</label>
                            <div class="stepper" style="border-radius: 10px;">
                                <button class="btn-step" id="minus-on-${this.id}" style="width: 38px; height: 38px;">-</button>
                                <input type="number" id="on-${this.id}" value="${this.onMin}" min="0" step="0.1">
                                <button class="btn-step" id="plus-on-${this.id}" style="width: 38px; height: 38px;">+</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>OFF (Menit)</label>
                            <div class="stepper" style="border-radius: 10px;">
                                <button class="btn-step" id="minus-off-${this.id}" style="width: 38px; height: 38px;">-</button>
                                <input type="number" id="off-${this.id}" value="${this.offMin}" min="0" step="0.1">
                                <button class="btn-step" id="plus-off-${this.id}" style="width: 38px; height: 38px;">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="timer-row">
                        <div class="status-label" id="state-${this.id}">System Idle</div>
                        <div class="timer-val" id="timer-${this.id}">00:00</div>
                    </div>

                    <div class="btn-group" style="gap: 8px; margin-bottom: 8px;">
                        <button class="btn-manual btn-on" id="manual-on-${this.id}" style="padding: 8px; font-size: 11px;">FORCE ON</button>
                        <button class="btn-manual btn-off" id="manual-off-${this.id}" style="padding: 8px; font-size: 11px;">FORCE OFF</button>
                    </div>

                    <button class="btn-main" id="btn-${this.id}" style="padding: 10px; font-size: 13px;">Mulai Scheduler</button>

                    <div class="logs" id="logs-${this.id}" style="margin-top: 12px; height: 60px; font-size: 10px;">
                        <div class="log-entry">Awaiting start...</div>
                    </div>
                `;
                grid.appendChild(card);

                // Cache elements
                this.dom = {
                    label: document.getElementById(`label-${this.id}`),
                    token: document.getElementById(`token-${this.id}`),
                    on: document.getElementById(`on-${this.id}`),
                    off: document.getElementById(`off-${this.id}`),
                    btn: document.getElementById(`btn-${this.id}`),
                    dot: document.getElementById(`dot-${this.id}`),
                    timer: document.getElementById(`timer-${this.id}`),
                    state: document.getElementById(`state-${this.id}`),
                    logs: document.getElementById(`logs-${this.id}`),
                    remove: document.getElementById(`remove-${this.id}`),
                    open: document.getElementById(`open-${this.id}`),
                    manualOn: document.getElementById(`manual-on-${this.id}`),
                    manualOff: document.getElementById(`manual-off-${this.id}`)
                };

                // Events
                this.dom.btn.onclick = () => this.toggleScheduler();
                this.dom.remove.onclick = () => this.remove();
                this.dom.manualOn.onclick = () => {
                    this.log("Manual Force ON triggered");
                    this.sendApiRequest(true);
                };
                this.dom.manualOff.onclick = () => {
                    this.log("Manual Force OFF triggered");
                    this.sendApiRequest(false);
                };
                this.dom.open.onclick = () => {
                    const token = this.dom.token.value.trim();
                    if (token) window.open(`https://app.overlays.uno/control/${token}`, '_blank');
                    else alert("Token kosong, Pak!");
                };

                // Stepper Handlers
                const setupStepper = (inputId, delta) => {
                    const input = document.getElementById(inputId);
                    let val = parseFloat(input.value) || 0;
                    val = Math.max(0, parseFloat((val + delta).toFixed(1)));
                    input.value = val;
                    saveAllSchedulers();
                };

                document.getElementById(`minus-on-${this.id}`).onclick = () => setupStepper(`on-${this.id}`, -0.1);
                document.getElementById(`plus-on-${this.id}`).onclick = () => setupStepper(`on-${this.id}`, 0.1);
                document.getElementById(`minus-off-${this.id}`).onclick = () => setupStepper(`off-${this.id}`, -0.1);
                document.getElementById(`plus-off-${this.id}`).onclick = () => setupStepper(`off-${this.id}`, 0.1);

                // Auto-save on change
                const inputs = [this.dom.label, this.dom.token, this.dom.on, this.dom.off];
                inputs.forEach(input => {
                    input.onchange = () => saveAllSchedulers();
                });
            }

            log(message, type = '') {
                const div = document.createElement('div');
                div.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString();
                div.textContent = `[${time}] ${message}`;
                this.dom.logs.prepend(div);
            }

            async sendApiRequest(show) {
                const token = this.dom.token.value.trim();
                if (!token) return;

                const url = `https://app.overlays.uno/apiv2/controlapps/${token}/api`;

                // List perintah yang akan dicoba (untuk fleksibilitas antar jenis overlay)
                const commands = [
                    show ? "ShowOverlay" : "HideOverlay",
                    show ? "ShowAllOverlays" : "HideAllOverlays"
                ];

                let lastStatus = 0;
                let success = false;

                for (const cmd of commands) {
                    try {
                        const response = await fetch(url, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ command: cmd })
                        });

                        lastStatus = response.status;
                        if (response.ok) {
                            success = true;
                            break; // Jika salah satu berhasil, stop mencoba
                        }
                    } catch (err) {
                        console.error(`Attempt failed for ${cmd}:`, err);
                    }
                }

                if (success) {
                    this.log(`API Success: Turn ${show ? 'ON' : 'OFF'}`, 'success');
                } else {
                    this.log(`API Error: ${lastStatus}`, 'error');
                }
            }

            updateDisplay() {
                const mins = Math.floor(this.remainingTime / 60);
                const secs = this.remainingTime % 60;
                this.dom.timer.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                this.dom.state.textContent = this.isRunning ? `Overlay is ${this.currentState}` : "System Idle";
                this.dom.dot.className = 'status-dot ' + (this.isRunning && this.currentState === 'ON' ? 'active' : '');
            }

            async runCycle() {
                if (!this.isRunning) return;

                this.currentState = (this.currentState === 'ON' ? 'OFF' : 'ON');
                const duration = this.currentState === 'ON' ? parseFloat(this.dom.on.value) : parseFloat(this.dom.off.value);
                this.remainingTime = Math.round(duration * 60);

                this.log(`Switching to ${this.currentState} (${duration}m)`);
                await this.sendApiRequest(this.currentState === 'ON');
                this.updateDisplay();

                if (this.timerInterval) clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.remainingTime--;
                    if (this.remainingTime <= 0) {
                        clearInterval(this.timerInterval);
                        this.runCycle();
                    }
                    this.updateDisplay();
                }, 1000);
            }

            toggleScheduler() {
                if (!this.isRunning) {
                    if (!this.dom.token.value.trim()) {
                        alert("Masukkan Token dulu, Pak!");
                        return;
                    }
                    this.isRunning = true;
                    this.dom.btn.textContent = "Hentikan Scheduler";
                    this.dom.btn.classList.add('running');
                    this.log("Started");
                    this.currentState = 'OFF';
                    this.runCycle();
                } else {
                    this.isRunning = false;
                    clearInterval(this.timerInterval);
                    this.dom.btn.textContent = "Mulai Scheduler";
                    this.dom.btn.classList.remove('running');
                    this.dom.timer.textContent = "00:00";
                    this.log("Stopped");
                    this.sendApiRequest(false);
                    this.updateDisplay();
                }
            }

            remove() {
                if (confirm("Hapus scheduler ini, Pak?")) {
                    if (this.isRunning) this.toggleScheduler();
                    document.getElementById(`card-${this.id}`).remove();
                    schedulers = schedulers.filter(s => s.id !== this.id);
                    saveAllSchedulers();
                }
            }

            getData() {
                return {
                    id: this.id,
                    label: this.dom.label.value,
                    token: this.dom.token.value,
                    onMin: this.dom.on.value,
                    offMin: this.dom.off.value
                };
            }
        }

        let schedulers = [];

        function saveAllSchedulers() {
            const data = schedulers.map(s => s.getData());
            localStorage.setItem('uno_schedulers', JSON.stringify(data));
        }

        function loadAllSchedulers() {
            const data = JSON.parse(localStorage.getItem('uno_schedulers')) || [
                { id: '1', label: 'UNO Ticker', token: '3LHZocfShz3S8mUOQQdhPY', onMin: 0, offMin: 0 },
                { id: '2', label: 'UNO Essentials', token: '5mG5rKJqD1ECxc9LvVYbBu', onMin: 0, offMin: 0 }
            ];
            data.forEach(d => {
                const s = new OverlayScheduler(d);
                schedulers.push(s);
            });
        }

        document.getElementById('btnAddOverlay').onclick = () => {
            const s = new OverlayScheduler({ label: 'Overlay Baru' });
            schedulers.push(s);
            saveAllSchedulers();
        };

        // Init
        loadAllSchedulers();
    </script>
</body>

</html>
